content_signals:
  present: true
  source_url: https://aigen.io/robots.txt
  directive: 'Content-Signal: search=yes,ai-train=no,use=reference'
  provenance: >-
    The Content-Signal line is emitted inside a "# BEGIN Cloudflare Managed content" block, so it
    is Cloudflare's managed-robots.txt feature serving on Aigen's domain rather than a line Aigen
    typed. It is served from a host Aigen controls and is recorded as present on that basis; the
    authorship distinction is stated here rather than implied.
  stated_vs_deployed_conflict: true
  conflict_detail: >-
    Aigen's own authored block, further down the same file, explicitly Allows GPTBot, OAI-SearchBot,
    ChatGPT-User, ClaudeBot, Claude-SearchBot, Claude-User, PerplexityBot, Perplexity-User,
    Google-Extended, Applebot-Extended, Amazonbot, Bytespider, meta-externalagent and CCBot, and
    carries a comment saying Aigen wants to be "discoverable and referenceable in AI search
    results". The Cloudflare managed block above it Disallows Amazonbot, Applebot-Extended,
    Bytespider and meta-externalagent. Under robots.txt group precedence the first matching
    user-agent group wins, so for those four agents the edge blocks what the site owner wrote an
    Allow for. Aigen's own comment anticipates this and names the dashboard toggle. Recorded as an
    observed stated-policy-vs-deployed-behavior divergence, not as a fault.
