aid: aigen
name: Aigen
description: >-
  Aigen ("AI Generated Agriculture") is a Kirkland, Washington robotics company founded in 2020 that
  builds fully autonomous, solar-powered farm robots for daily, chemical-free weed control. Its
  flagship product, the Element, uses AI vision to identify and mechanically strike weeds — including
  herbicide-resistant weeds — with no herbicides, running on solar power with onboard battery storage
  and coordinating as a crew over a mesh network. In 2026 Aigen introduced Alchemy, a generative world
  model for outdoor physical AI that produces self-labeling synthetic training data. Aigen sells a
  managed robotics-as-a-service engagement rather than a self-serve developer product: growers are
  onboarded through a local Aigen agent and an intake form, and Aigen operates and maintains the fleet
  through the growing season. As of this profile Aigen publishes no public developer portal, API
  reference, or machine-readable API contract.
